<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Online Book Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>📚 Online Book Store</h1>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="cart.html" class="active cart-link">Cart <span id="cart-badge" class="cart-badge" style="display:none;">0</span></a></li>
                <li><a href="#" onclick="Auth.logout(); return false;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="cart-container">
        <h1>🛒 Your Shopping Cart</h1>
        <div id="cart-items">
            <!-- Filled by JS -->
        </div>
        <div class="cart-total" id="cart-total"></div>
        <div style="text-align:center; margin-top:20px;" id="checkout-section">
            <button class="btn" onclick="checkout()" id="checkout-btn">💳 Checkout</button>
            <button class="btn btn-dark" onclick="Cart.clear(); renderCart(); showToast('Cart cleared!');" style="margin-left:10px;">🗑️ Clear Cart</button>
        </div>
    </div>

    <footer>
        <p>CopyRights © D.V Sai Srihitha 22761A0576 | Online Book Store</p>
    </footer>

    <script src="js/app.js"></script>
    <script>
        renderCart();

        function checkout() {
            if (Cart.getCount() === 0) {
                showToast('Your cart is empty!');
                return;
            }
            if (!Auth.isLoggedIn()) {
                showToast('Please login to checkout!');
                setTimeout(() => window.location.href = 'login.html', 1000);
                return;
            }
            const total = Cart.getTotal();
            Cart.clear();
            renderCart();
            showToast(`Order placed successfully! Total: ₹${total}`);
        }
    </script>
</body>
</html>
